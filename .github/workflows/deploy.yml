name: Deploy Backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button bhi milega Actions tab me

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_FILE
          command_timeout: 15m
          script: |
            set -e
            cd ~/family-talk-backend

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Writing .env from GitHub Secrets"
            printf '%s\n' "$ENV_FILE" > .env

            echo "==> Installing dependencies"
            npm ci

            echo "==> Building"
            npm run build

            echo "==> Running database migrations (Hostinger DB)"
            npm run migration:run:prod

            echo "==> Restarting app with pm2"
            pm2 restart family-talk || pm2 start dist/main.js --name family-talk
            pm2 save

            echo "==> Deploy complete ✅"
